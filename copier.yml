algorithm_name:
    type: str
    help: What is your algorithm name?
    validator: |-
      {% if algorithm_name == 'test' %}
        Algorithm name cannot be 'test'. This conflicts with generated test files.
      {% endif %}

algorithm_description:
    type: str
    help: Please enter a short description (one sentence) of your algorithm.

open_source_license:
  type: str
  help: "The open source license to use"
  choices:
    "MIT": mit
    "Apache Software License 2.0": apache
    "GNU General Public License v3": gpl
    "No license (you can add one later)": no_license

# ------------- Define central algorithm function ---------- #

has_central_function:
  type: bool
  help: "Do you want to use a central function in your algorithm?"
  default: true

central_function_name:
  type: str
  when: "{{ has_central_function }}"
  help: "What is the name of your central function?"
  default: central_function

central_args:
  type: json
  when: "{{ has_central_function }}"
  help: "Add a list of arguments to the central function '{{ central_function_name }}'"
  default: ['arg1', ]
  multiline: true

# ------------- Define federated algorithm function ---------- #

has_federated_function:
  type: bool
  help: "Do you want to use a federated function in your algorithm?"
  default: true

federated_function_name:
  type: str
  when: "{{ has_federated_function }}"
  help: "What is the name of your federated function?"
  default: federated_function

federated_function_data:
  type: bool
  when: "{{ has_federated_function }}"
  help: "Do you want to use data in your federated function?"
  default: true

federated_function_number_databases:
  type: int
  when: "{{ has_federated_function and federated_function_data }}"
  help: "How many databases do you want to use in your federated function?"
  default: |-
    {%- if has_federated_function and federated_function_data -%}
      1
    {%- else -%}
      0
    {%- endif -%}
  validator: |-
    {% if has_federated_function and federated_function_number_databases < 1 %}
      Must be at least 1
    {% endif %}

federated_args:
  type: json
  when: "{{ has_federated_function }}"
  help: "Add a list of arguments to the federated function '{{ federated_function_name }}'"
  default: ['arg1', ]
  multiline: true

# ----------------------- Data extraction ------------------- #

import_infra_extraction:
  type: bool
  help: "Do you want to make the default vantage6 data extraction functions available in your algorithm?"
  default: true

has_data_extraction:
  type: bool
  help: "Do you want to define your own data extraction function in your algorithm?"
  default: true

data_extraction_function_name:
  type: str
  when: "{{ has_data_extraction }}"
  help: "What is the name of your data extraction function?"
  default: data_extraction_function

data_extraction_args:
  type: json
  when: "{{ has_data_extraction }}"
  help: "Add a list of arguments to the data extraction function '{{ data_extraction_function_name }}'"
  default: ['arg1', ]
  multiline: true

# ----------------------- Data preprocessing ------------------- #

import_infra_preprocessing:
  type: bool
  help: "Do you want to make the default vantage6 data preprocessing functions available in your algorithm?"
  default: true

has_data_preprocessing:
  type: bool
  help: "Do you want to define your own data preprocessing function in your algorithm?"
  default: true

data_preprocessing_function_name:
  type: str
  when: "{{ has_data_preprocessing }}"
  help: "What is the name of your data preprocessing function?"
  default: data_preprocessing_function

data_preprocessing_args:
  type: json
  when: "{{ has_data_preprocessing }}"
  help: "Add a list of arguments to the data preprocessing function '{{ data_preprocessing_function_name }}'"
  default: ['arg1', ]
  multiline: true

# ----------------------- Documentation --------------------- #

has_docs:
  type: bool
  help: "Do you want to add documentation to your algorithm?"
  default: true

project_name:
  type: str
  when: "{{ has_docs }}"
  help: "What is the name of your project?"
  default: "{{ algorithm_name }}"

author:
  type: str
  when: "{{ has_docs }}"
  help: "Who are the authors of the project?"

copyright:
  type: str
  when: "{{ has_docs }}"
  help: "Please add a copyright message to include in the documentation."


# ----------------------- Advanced ------------------------- #

advanced:
  type: bool
  help: "Do you want to see the advanced options?"
  default: true

has_gh_pipeline:
  type: bool
  when: "{{ advanced }}"
  help: "Do you want to use GitHub Actions for CI/CD?"
  default: "{{advanced}}"

private_registry:
  type: bool
  when: "{{ advanced and has_gh_pipeline }}"
  help: "Do you want to use a private Docker registry?"
  default: |-
    {%- if advanced and has_gh_pipeline -%}
      true
    {%- else -%}
      false
    {%- endif -%}

docker_registry:
  type: str
  when: "{{ advanced and has_gh_pipeline and private_registry }}"
  help: "The Docker registry to use for the GitHub Actions pipeline"
  default: harbor2.vantage6.ai

docker_image:
  type: str
  when: "{{ advanced and has_gh_pipeline }}"
  help: "The Docker image name to use for the GitHub Actions pipeline"
  default: |-
    {%- if private_registry -%}
      {{docker_registry}}/{{algorithm_name}}
    {%- else -%}
      {{algorithm_name}}
    {%- endif -%}

# ----------------------- Copier metadata ------------------ #

# Additional copier metadata
_min_copier_version: "8.0.0"
_tasks:
  # Remove license file if no license
  # TODO this doesn't work yet on Windows, no 'rm' command... Maybe we can
  # find an easier solution by handling this in the `v6 algorithm` command
  # - >-
  #   {% if _copier_conf.os in ['linux', 'macos'] %}
  #     {% if open_source_license == 'no_license' %}
  #       rm LICENSE
  #     {% endif %}
  #   {% elif _copier_conf.os == 'windows' %}
  #     Remove-Item LICENSE
  #   {% endif %}
  # TODO: similarly, delete if empty: central.py, federated.py
  # Call python script that cleans up
  - ["{{ _copier_python }}", cleanup.py]
_message_after_copy: |
  Your algorithm template "{{ algorithm_name }}" has been created successfully!

  Checkout the README.md file for more information on how to get started. It
  contains a checklist to help you further develop your algorithm.
_message_before_copy: |

  Welcome to the vantage6 algorithm template creator!

  You will be asked a series of questions to generate the basis of your new
  vantage6 algorithm in Python.
_envops:
  # Jinja settings to remove whitespace
  lstrip_blocks: true
  trim_blocks: true
_exclude:
  # exclude jinja macro files from being copied to algorithm
  - macros
  - .git
  - copier.yml